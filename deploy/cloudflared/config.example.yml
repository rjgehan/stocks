# Cloudflare Tunnel ingress for stocks (ARCHITECTURE §24.5, docs/deploy.md "Cloudflare Tunnel").
#
# For a LOCALLY-managed tunnel (config.yml + credentials file). For a remotely-managed tunnel (token; the usual
# CasaOS cloudflared app), add the same hostname under Zero Trust → Networks → Tunnels → <tunnel> →
# Public hostnames instead: type HTTP, URL = stocks-app:8080. The default setup needs neither: the stocks-cloudflared
# sidecar in docker-compose.yml runs this app's own token tunnel (CLOUDFLARE_TUNNEL_TOKEN in .env).
#
# One hostname carries HTTP and WebSocket (/ws): no extra rule is needed for WebSockets.
tunnel: <tunnel-uuid>
credentials-file: /etc/cloudflared/<tunnel-uuid>.json

ingress:
  - hostname: stocks.example.com
    # The app publishes no host port: cloudflared must be on the `stocks-edge` Docker network, like the
    # stocks-cloudflared sidecar in docker-compose.yml (or join yours: docker network connect stocks-edge <name>).
    service: http://stocks-app:8080
    originRequest:
      connectTimeout: 10s
      keepAliveTimeout: 90s
  - service: http_status:404
