# Optional local PostgreSQL 18.6 for the `devpg` profile (ARCHITECTURE §3, §23.2). Development only: production is
# docker-compose.yml, and tests use embedded PostgreSQL (`make test-pg`, no Docker).
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev,devpg
#
# The credentials match application-devpg.yml's defaults (DB_URL/DB_USER/DB_PASSWORD override them).
name: stocks-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: stocks
      POSTGRES_USER: stocks
      POSTGRES_PASSWORD: stocks
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql # PG 18 image layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocks"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
