# Release and deploy (ARCHITECTURE §24.7, docs/deploy.md).
#
#   push to main       → CI (ci.yml) → multi-arch image to GHCR (latest + sha-<7>) → deploy to the CasaOS server
#                        (the agent runner goes to the same package as agent-runner-latest + agent-runner-sha-<7>)
#   push of a v* tag   → CI → image (X.Y.Z, X.Y, sha-<7>; never `latest`); no deploy (dispatch one if you want it)
#   workflow_dispatch  → tag empty: CI → image (sha-<7>) → deploy; tag set: deploy/roll back to that existing tag
#
# `latest` comes only from the default branch (flavor latest=false: metadata-action would otherwise add it for every
# semver tag, so tagging an old commit would move `latest`, which Watchtower and CasaOS Import installs follow).
# The deploy job runs on the owner's self-hosted runner [self-hosted, casaos] and only when the repository
# variable DEPLOY_ENABLED is 'true', for pushes to main and for dispatches from main or a v* tag. It never runs for
# pull requests (this workflow has no pull_request trigger). A dispatch with `tag` set from main changes only the
# image (--no-sync-compose); from a v* tag it also installs that tag's docker-compose.yml.
# Repository variables: DEPLOY_ENABLED, DEPLOY_DIR (default /DATA/AppData/stocks/compose), DEPLOY_SYNC_COMPOSE
# (true), DEPLOY_PROFILES (e.g. agents), DEPLOY_HEALTH_TIMEOUT (420), DEPLOY_PUBLIC_URL (optional smoke test).
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to deploy or roll back to (sha-1a2b3c4, 1.2.3). Empty = test, build and deploy this ref.
        type: string
        default: ''
      deploy:
        description: Deploy to the CasaOS server (also needs the repository variable DEPLOY_ENABLED=true)
        type: boolean
        default: true

permissions:
  contents: read

# Builds of one ref run one at a time. A tag-only dispatch (deploy or roll back an existing image) gets a group of
# its own, so it neither waits behind a whole build-and-deploy run nor is replaced by a newer pending push; the
# deploy job's own `deploy-casaos` group still keeps two deploy.sh runs from overlapping on the server.
concurrency:
  group: ${{ inputs.tag != '' && format('release-rollback-{0}', github.run_id) || format('release-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve image and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.vars.outputs.image }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      build: ${{ steps.vars.outputs.build }}
      deploy_tag: ${{ steps.vars.outputs.deploy_tag }}
    steps:
      - id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || [ "$INPUT_TAG" = "rollback" ]; then
              echo "::error::invalid image tag '$INPUT_TAG'"
              exit 1
            fi
            build=false
            deploy_tag="$INPUT_TAG"
          else
            build=true
            deploy_tag="sha-${short_sha}"
          fi
          {
            echo "image=ghcr.io/${owner}/stocks"
            echo "short_sha=${short_sha}"
            echo "build=${build}"
            echo "deploy_tag=${deploy_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "image ghcr.io/${owner}/stocks, build=${build}, deploy tag ${deploy_tag}"

  ci:
    name: CI
    needs: meta
    if: needs.meta.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      skip-image: true
    permissions:
      contents: read

  image:
    name: Build and push image
    needs: [meta, ci]
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          # `latest` only from the explicit raw tag below (default branch), never implied by a semver tag
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ needs.meta.outputs.short_sha }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=stocks
            org.opencontainers.image.description=stocks paper-trading league (Spring Boot API + React SPA)
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          annotations: ${{ steps.docker-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=stocks
          cache-to: type=gha,scope=stocks,mode=max
      # The agent runner goes into the SAME package with the tag prefix agent-runner- (agent-runner-sha-<7>,
      # agent-runner-latest, agent-runner-X.Y.Z), so a public `stocks` package needs no second package made public.
      - id: agent-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.meta.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=agent-runner-sha-${{ needs.meta.outputs.short_sha }}
            type=semver,pattern={{version}},prefix=agent-runner-
            type=semver,pattern={{major}}.{{minor}},prefix=agent-runner-
            type=raw,value=agent-runner-latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=stocks-agent-runner
            org.opencontainers.image.description=stocks agent runner (Claude and ChatGPT league bots)
      - id: agent-build
        name: Build and push agent-runner image
        uses: docker/build-push-action@v7
        with:
          context: tools/agent-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          annotations: ${{ steps.agent-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=agent-runner
          cache-to: type=gha,scope=agent-runner,mode=max
      - name: Summary
        env:
          TAGS: ${{ steps.docker-meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AGENT_TAGS: ${{ steps.agent-meta.outputs.tags }}
          AGENT_DIGEST: ${{ steps.agent-build.outputs.digest }}
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            while IFS= read -r t; do if [ -n "$t" ]; then echo "- \`$t\`"; fi; done <<< "$TAGS"
            echo ""
            echo "### Agent runner pushed"
            echo ""
            echo "Digest: \`${AGENT_DIGEST}\`"
            echo ""
            while IFS= read -r t; do if [ -n "$t" ]; then echo "- \`$t\`"; fi; done <<< "$AGENT_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to CasaOS
    needs: [meta, image]
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' &&
      (needs.image.result == 'success' || (needs.image.result == 'skipped' && needs.meta.outputs.build == 'false')) &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: [self-hosted, casaos]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-casaos
      cancel-in-progress: false
    env:
      STOCKS_IMAGE: ${{ needs.meta.outputs.image }}
      DEPLOY_TAG: ${{ needs.meta.outputs.deploy_tag }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/DATA/AppData/stocks/compose' }}
      DEPLOY_SYNC_COMPOSE: ${{ vars.DEPLOY_SYNC_COMPOSE || 'true' }}
      DEPLOY_HEALTH_TIMEOUT: ${{ vars.DEPLOY_HEALTH_TIMEOUT || '420' }}
      COMPOSE_PROFILES: ${{ vars.DEPLOY_PROFILES }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
      - name: Use a job-scoped Docker config
        # Keeps the short-lived GITHUB_TOKEN login out of the runner user's ~/.docker/config.json.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -sfn "$HOME/.docker/cli-plugins" "$RUNNER_TEMP/docker-config/cli-plugins"
          fi
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy ${{ needs.meta.outputs.deploy_tag }}
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          args=(--tag "$DEPLOY_TAG" --sync-from "$GITHUB_WORKSPACE")
          if [ -n "$INPUT_TAG" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # A rollback (or redeploy) of an existing image from main: change only the image. main's newest
            # docker-compose.yml may not fit an older image; dispatch from the matching v* tag to take its compose file.
            args+=(--no-sync-compose)
          fi
          bash deploy/scripts/deploy.sh "${args[@]}"
      - name: Public URL smoke test
        if: success() && vars.DEPLOY_PUBLIC_URL != ''
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL%/}/" || true)"
          if [ "$code" = "200" ]; then
            echo "${PUBLIC_URL} answers 200"
          else
            echo "::warning::${PUBLIC_URL} answered '${code}' (the app is healthy locally; check the Cloudflare Tunnel)"
            exit 1
          fi
