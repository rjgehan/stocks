# MCP tool coverage (ARCHITECTURE §20.3, checked by McpToolCoverageTest): every non-admin GET in docs/openapi.json
# maps to an MCP tool (`tools`) or is on the explicit exclusion list (`excluded`, with the reason). Path variables
# match by position, whatever their name ({orderId} = {id}). Add a row in the PR that adds a GET endpoint.
tools:
  /api/v1/rules: get_rules
  /api/v1/market/clock: get_market_clock
  /api/v1/market/calendar: get_calendar
  /api/v1/market/movers: get_movers
  /api/v1/assets/search: search_symbols
  /api/v1/assets/{symbol}: get_asset
  /api/v1/quotes: get_quotes
  /api/v1/snapshots/{symbol}: get_snapshot
  /api/v1/bars/{symbol}: get_bars
  /api/v1/news: get_news
  /api/v1/account: get_account
  /api/v1/account/balances: get_account
  /api/v1/account/positions: get_positions
  /api/v1/account/activities: get_activity
  /api/v1/account/executions: get_executions
  /api/v1/account/history: get_portfolio_history
  /api/v1/account/violations: get_violations
  /api/v1/account/runs: get_runs
  /api/v1/orders: get_orders
  /api/v1/orders/{orderId}: get_order
  /api/v1/order-groups/{groupId}: get_order_group
  /api/v1/watchlists: get_watchlists
  /api/v1/leaderboard: get_leaderboard
  /api/v1/players: list_players
  /api/v1/players/{handle}: get_player_profile
  /api/v1/players/{handle}/history: get_player_history
  /api/v1/players/{handle}/trades: get_player_trades
  /api/v1/feed: get_league_feed
  /api/v1/me/notifications: get_notifications
  # Phase 2, league slice (§16.8–16.10)
  /api/v1/account/stats: get_my_stats
  /api/v1/players/{handle}/stats: get_player_stats
  /api/v1/league/race: get_race_chart
  /api/v1/account/pnl-calendar: get_pnl_calendar
  /api/v1/account/pnl-analysis: get_pnl_analysis
  /api/v1/alerts: list_alerts
  # Phase 2 (§15.10)
  /api/v1/market/screener: screen_stocks
  /api/v1/assets/{symbol}/recommendations: get_recommendations
  /api/v1/players/{handle}/journal: get_player_journal
  # public mode (§16.7)
  /api/v1/players/{handle}/portfolio: get_player_portfolio
  /api/v1/players/{handle}/orders: get_player_orders
  /api/v1/players/{handle}/activities: get_player_activity
  /api/v1/players/{handle}/pnl-analysis: get_player_pnl_analysis
  /api/v1/players/{handle}/pnl-calendar: get_player_pnl_calendar
excluded:
  /api/v1/auth/csrf: browser CSRF bootstrap
  /api/v1/me: whoami returns the same Me
  /api/v1/me/api-keys: session only (an agent cannot manage keys)
  /api/v1/assets/{symbol}/logo: binary image
  /api/v1/market/indices: get_quotes with SPY, QQQ, DIA, IWM
  /api/v1/account/positions/{symbol}: get_positions
  /api/v1/orders/by-client-id/{clientOrderId}: get_order with client_order_id
  /api/v1/me/push: session only (this browser's Web Push settings; bots have no browser subscriptions)
  /api/v1/assets/{symbol}/trades: Time & Sales is a live UI tape that exists only while a viewer's stream covers the symbol (§15.10); bots use get_snapshot and get_bars
  /api/v1/me/oauth/requests/{requestId}: session only (the human's OAuth consent screen, §17.9.3)
  /api/v1/me/connected-apps: session only (the human's OAuth grants, §17.9.1)
  /api/v1/players/{handle}/agent-runs: runner telemetry for profiles (Phase 2, §20.6), not trading data
  /api/v1/me/api-calls: session only (Recent API calls in Settings, §17.10)
  /api/v1/stream: Server-Sent Events for scripts (§19.3); MCP is request/response
  /api/v1/me/bots/{handle}/manual: session only (the owner's manual-bot console, §20.8)
  /api/v1/players/{handle}/manual-sessions: pasted AI replies, kept off MCP (§20.8); their orders are in get_player_orders and summaries in get_player_journal
  /api/v1/players/{handle}/manual-sessions/{sessionId}: same as above (§20.8)
